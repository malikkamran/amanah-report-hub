<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Amanah Report Hub</title>
    <meta
      name="description"
      content="A public community queue for sharing reportable issue links, copy-ready report text, and screenshots."
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">Community Reporting Workspace</p>
        <h1>Amanah Report Hub</h1>
      </div>
      <div class="top-actions">
        <span id="syncState" class="pill">Connecting...</span>
        <button id="refreshBtn" class="secondary" type="button">Refresh</button>
      </div>
    </header>

    <main class="layout">
      <section class="panel intake" aria-labelledby="intake-title">
        <div class="section-heading">
          <div>
            <p class="eyebrow">Submit</p>
            <h2 id="intake-title">Add an issue</h2>
          </div>
        </div>

        <form id="issueForm">
          <label>
            URL
            <input name="url" type="url" placeholder="https://example.com/post/123" required />
          </label>
          <div class="grid-two">
            <label>
              Platform
              <select name="platform">
                <option>Website</option>
                <option>WeChat</option>
                <option>Weibo</option>
                <option>Douyin</option>
                <option>Bilibili</option>
                <option>X / Twitter</option>
                <option>YouTube</option>
                <option>Other</option>
              </select>
            </label>
            <label>
              Version / Priority
              <select name="severity">
                <option>Needs review</option>
                <option>Low</option>
                <option>Medium</option>
                <option>High</option>
              </select>
            </label>
          </div>
          <label>
            Report content to copy
            <textarea
              name="reportContent"
              rows="5"
              placeholder="Paste the exact text people should submit when reporting this issue."
              required
            ></textarea>
          </label>
          <label>
            Screenshot / picture
            <input name="screenshot" type="file" accept="image/*" />
            <span class="field-note">Images are compressed before cloud save.</span>
          </label>
          <button id="submitBtn" class="primary" type="submit">Add to queue</button>
        </form>
      </section>

      <section class="workspace">
        <section class="stats" aria-label="Queue summary">
          <article>
            <span id="totalCount">0</span>
            <p>Total issues</p>
          </article>
          <article>
            <span id="openCount">0</span>
            <p>Open</p>
          </article>
          <article>
            <span id="reportedCount">0</span>
            <p>Reported</p>
          </article>
          <article>
            <span id="highCount">0</span>
            <p>High priority</p>
          </article>
        </section>

        <section class="panel filters" aria-label="Filters">
          <input id="search" type="search" placeholder="Search URL, report content, platform..." />
          <select id="severityFilter">
            <option value="all">All priorities</option>
            <option>High</option>
            <option>Medium</option>
            <option>Low</option>
            <option>Needs review</option>
          </select>
        </section>

        <section class="panel queue" aria-labelledby="queue-title">
          <div class="section-heading">
            <div>
              <p class="eyebrow">Daily Queue</p>
              <h2 id="queue-title">Issues to review and report</h2>
            </div>
          </div>
          <div id="issueList" class="issue-list"></div>
          <p id="emptyState" class="empty">No issues yet. Add a URL.</p>
        </section>
      </section>

    </main>

    <template id="issueTemplate">
      <article class="issue-card">
        <div class="issue-main">
          <div class="issue-summary">
            <div class="tag-row">
              <span class="platform-tag"></span>
              <span class="badge"></span>
              <span class="count-pill"></span>
            </div>
            <h3></h3>
            <a class="url" target="_blank" rel="noreferrer"></a>
          </div>
          <div class="quick-actions">
            <button type="button" data-action="report" class="report-button">Report</button>
            <button type="button" data-action="details">Details</button>
          </div>
        </div>
        <div class="issue-details" hidden>
          <button type="button" data-action="copy" class="copy-detail">Copy content</button>
          <div class="report-content"></div>
          <img class="screenshot-preview" alt="Attached screenshot" />
        </div>
      </article>
    </template>

    <script src="./app.js"></script>
  </body>
</html>
